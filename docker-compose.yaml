# LOCAL - для локальной разработки
#
name: go-test-task

networks:
  main:
    driver: bridge

volumes:
  pgsql:
    driver: local
  gomod:
    driver: local

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-common: &common
  networks:
    - main
  <<: *logging

x-app-depends: &app-depends
  depends_on:
    database:
      condition: service_healthy

services:

# GATEWAYS
  caddy:
    image: caddy:2.11
    <<: *common
    ports:
      - "${DEPLOYMENT_PROXY_PORT:-8000}:80"
    volumes:
      - ./.docker/caddy/local/Caddyfile:/etc/caddy/Caddyfile

# APPLICATIONS

  app:
    <<:
      - *common
      - *app-depends
    image: go-test-task-local
    init: true
    env_file: .env
    build:
      dockerfile: .docker/app/Dockerfile
      target: dev
    volumes:
      - "./:/app"
      - "gomod:/go/pkg/mod"
      - "./.env:/app/.env:ro"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

# STORES

  database:
    image: postgres:17.5
    <<: *common
    volumes:
      - "pgsql:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_DATABASE}"
    ports:
      - "${DEPLOYMENT_PGSQL_PORT:-5432}:5432"
    deploy:
      resources:
        limits:
          cpus: "4.00"
          memory: 2048M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5


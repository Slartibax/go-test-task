version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - dogsled
    - durationcheck
    - errname
    - errorlint
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - goprintffuncname
    - gosec
    - intrange
    - mirror
    - misspell
    - modernize
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - usetesting
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    govet:
      enable:
        - nilness
        - shadow
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - hugeParam
        - octalLiteral
        - whyNoLint
        - unnamedResult
        - wrapperFunc
    misspell:
      locale: US
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: package-comments
          disabled: true

  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: go-test-task
    goimports:
      local-prefixes:
        - go-test-task

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
